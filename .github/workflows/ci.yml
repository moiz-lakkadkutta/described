name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
        with: { path: app }
      # The kit is consumed via a `link:../vega-media-kit` override until 0.1.0 is on npm; check it out as a sibling and build it.
      - uses: actions/checkout@v4
        with: { repository: moiz-lakkadkutta/vega-media-kit, path: vega-media-kit }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: vega-media-kit
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint:words
      - run: pnpm test
