// Local Expo module, autolinked from apps/expo/modules (expo-modules-autolinking `nativeModulesDir`).
// Same shape as expo-application's build.gradle (Expo SDK 54). It uses the framework android.media.session API
// (API 21+), not androidx.media / Media3; androidx.lifecycle only to read the current activity's state once.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.moizp.described'
version = '0.1.0'

android {
  namespace "dev.moizp.described.mediasession"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Lifecycle.State of the current activity (ReactActivity is a LifecycleOwner); already on the app's classpath
  // through androidx.core, declared here so this module compiles on its own.
  implementation 'androidx.lifecycle:lifecycle-common:2.6.1'
}
